services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: levra
      POSTGRES_PASSWORD: levra
      POSTGRES_DB: levra
    ports:
      - "${LEVRA_PG_PORT:-5442}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U levra"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
