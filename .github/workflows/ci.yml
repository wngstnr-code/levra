name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    env:
      MONAD_RPC_URL: ${{ secrets.MONAD_RPC_URL || 'https://rpc.monad.xyz' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - uses: actions/cache@v4
        with:
          path: ~/.foundry/cache/rpc
          key: foundry-rpc-${{ hashFiles('contracts/test/Base.t.sol') }}
      - name: Format
        run: forge fmt --check
      - name: Build
        run: forge build
      - name: Test on a fork of Monad
        run: forge test --network monad --no-match-contract InvariantsTest
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: ABIs are up to date
        run: |
          node script/export-abis.mjs
          git diff --exit-code -- ../packages/shared/abis

  slither:
    name: Static analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install slither-analyzer==0.11.6
      - name: Slither with the reviewed settings
        run: slither .

  packages:
    name: Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck test
