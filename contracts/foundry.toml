[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fmt]
line_length = 120

[lint]
exclude_lints = ["block-timestamp", "mixed-case-variable", "screaming-snake-case-immutable", "asm-keccak256"]
