[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fuzz]
# A fixed seed makes every run touch the same chain state, so the on-disk fork cache keeps working.
seed = "0x4c65767261"

[invariant]
runs = 6
depth = 40
fail_on_revert = false
show_metrics = true

[fmt]
line_length = 120

[lint]
exclude_lints = ["block-timestamp", "mixed-case-variable", "screaming-snake-case-immutable", "asm-keccak256"]
